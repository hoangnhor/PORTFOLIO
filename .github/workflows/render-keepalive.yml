name: Render Keep Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: |
          curl -fsS --max-time 20 \
            -H "Cache-Control: no-cache" \
            -H "Pragma: no-cache" \
            "https://portfolio-hqw1.onrender.com/api/health"
